# Gradle / AGP tuning for the FastVideo Android shell.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# JDK 17 is required by AGP 8.7 / Gradle 8.11. Prefer exporting JAVA_HOME before building
# (see android/README.md). If you must pin it for this machine only, uncomment and adjust:
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# Do not fail the build on lint's opinionated suggestions (run ./gradlew lintDebug to inspect).
android.lintOptions.abortOnError=false
kotlin.code.style=official
