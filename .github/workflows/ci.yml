name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit + node --check)
        run: npm run typecheck

      - name: Syntax-check every server and script module
        run: |
          shopt -s nullglob
          for f in server/src/*.js scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Desktop static guards (IPC allowlist, sender checks, packaging list)
        run: node desktop/src/check.cjs

      - name: Build the web client
        run: npm run build

      - name: End-to-end smoke against a scratch database
        run: |
          set -euo pipefail
          DATA="$(mktemp -d)"
          export DY_DATA_DIR="$DATA" DY_PORT=8791 DY_LOG=0
          node scripts/seed.mjs
          node server/src/index.js &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8791/api/health >/dev/null && break
            sleep 0.5
          done
          DY_SMOKE_BASE=http://127.0.0.1:8791 node scripts/smoke.mjs

      - name: Verify the build produced a loadable entry
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          compgen -G "web/dist/assets/*.js" > /dev/null
